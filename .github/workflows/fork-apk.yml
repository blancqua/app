name: fork-apk

# Fork-only workflow: lives on an orphan branch (fork/build-apk) so it never
# appears in branches/PRs based on main and cannot leak into upstream.
# Builds an installable release APK after format + tests pass.

on:
  push:
    branches:
      - fork/build-apk

concurrency:
  group: fork-apk
  cancel-in-progress: true

env:
  # Branch/tag to build — change and re-push this file to retarget.
  BUILD_REF: fork/release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter test

  apk:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Xmx8g
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
      - run: flutter pub get

      - name: Restore fork signing keystore
        working-directory: android/app
        run: |
          echo "${{ secrets.FORK_KEYSTORE_BASE64 }}" | base64 -d > fork-release.jks

      - name: Create key.properties
        working-directory: android
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=fork-key\nstoreFile=fork-release.jks\n' \
            "${{ secrets.FORK_KEYSTORE_PASSWORD }}" \
            "${{ secrets.FORK_KEYSTORE_PASSWORD }}" > key.properties

      - name: Stamp build number
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i "s/^version: .*/version: ${BASE}+${{ github.run_number }}/" pubspec.yaml
          echo "PUBSPEC_BASE=$BASE" >> $GITHUB_ENV

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vikunja-fork-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${PUBSPEC_BASE}-fork.${{ github.run_number }}"
          SHA=$(git rev-parse HEAD)
          APK="vikunja-fork-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release create "$TAG" \
            --target "$SHA" \
            --title "Vikunja fork build ${{ github.run_number }}" \
            --notes "Automated pre-release from \`${BUILD_REF}\` @ ${SHA:0:7} (run #${{ github.run_number }}). Tests passed; release APK signed with the fork keystore." \
            --prerelease || true
          gh release upload "$TAG" "$APK" --clobber
